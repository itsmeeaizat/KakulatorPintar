name: Build Custom Native APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Gradle APK and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper
        working-directory: ./android-app
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android-app
        run: ./gradlew assembleDebug --no-daemon -Pkotlin.incremental=false

      - name: Extract App Version and Setup Metadata
        id: metadata
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.$BUILD_NUM"

          APK_PATH=$(find android-app/app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -f "$APK_PATH" ]; then
            NEW_NAME="${REPO_NAME}-${VERSION_NAME}-debug.apk"
            cp "$APK_PATH" "$NEW_NAME"
            echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
            echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
            echo "APK_PATH=$NEW_NAME" >> $GITHUB_ENV
          else
            echo "File APK tidak ditemukan!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-apk
          path: ${{ env.APK_NAME }}

      - name: Release and Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref_name == 'main'
        with:
          files: ${{ env.APK_NAME }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION_NAME) }}
          name: "${{ github.event.repository.name }} v${{ env.VERSION_NAME }} (Build #${{ github.run_number }})"
          body: |
            ### 📱 ${{ github.event.repository.name }} (Android App)
            * **Developer:** Aizat
            * **App Version:** v${{ env.VERSION_NAME }}
            * **Build Number:** ${{ github.run_number }}
            * **Status:** Stable Release

            ### ✨ Catatan Versi:
            - Berhasil di-build otomatis dari folder `android-app`.
            - Silakan unduh file APK (`${{ env.APK_NAME }}`) di bagian Assets di bawah ini.
          draft: false
          prerelease: false
